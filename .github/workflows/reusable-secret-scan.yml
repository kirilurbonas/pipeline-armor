# =============================================================================
# pipeline-armor :: reusable-secret-scan.yml
# -----------------------------------------------------------------------------
# Detects committed secrets (API keys, tokens, private keys, etc.) by running
# Gitleaks and Trufflehog over the repository.
#
# Two scanners are used because they have complementary strengths:
#   - Gitleaks  : fast regex-based scan of git history. Good for historic
#                 leaks and for caller-provided custom rule sets.
#   - Trufflehog: verifies findings by attempting an authenticated request
#                 against the corresponding provider, which dramatically
#                 reduces false positives.
#
# Both scanners walk committed git history (never the working tree, so the
# `.pipeline-armor` helper checkout and `.git/` internals are never scanned).
# Findings are deduplicated by file:line across scanners and reported without
# ever printing the secret material itself. Verified secrets are critical,
# unverified ones high; a scanner that fails to run fails the gate closed.
# =============================================================================
name: reusable-secret-scan

on:
  workflow_call:
    inputs:
      scan_depth:
        description: >-
          Scope of the scan: all (full history) | diff (commits since
          base_ref, or since the previous push). `staged` is a deprecated
          alias for diff — nothing is staged on a CI runner.
        type: string
        default: 'all'
      fail_on_detection:
        description: 'Fail the job when verified secrets are detected.'
        type: boolean
        default: true
      fail_on_unverified:
        description: >-
          Also fail this job when unverified findings (e.g. Gitleaks regex
          hits) are detected. Default false. Note the deploy gate rates
          unverified findings `high`, so they block staging/prod regardless.
        type: boolean
        default: false
      baseline_file:
        description: 'Path to a Gitleaks baseline file of accepted findings.'
        type: string
        default: '.gitleaks.baseline.json'
      base_ref:
        description: 'Base ref for diff scans (only used when scan_depth=diff).'
        type: string
        default: ''
      trufflehog_exclude_detectors:
        description: >-
          Comma-separated Trufflehog detectors to skip. Default `Lob`: its
          pattern matches any 40-char `test_...` identifier (e.g. pytest
          function names) and Lob's API "verifies" them as test-mode keys,
          producing verified-secret false positives. Set to '' to re-enable.
        type: string
        default: 'Lob'

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No security-events: write. Requesting it would break every existing caller
# that doesn't grant it, so secrets.sarif ships in the artifact only for now
# (Security-tab upload is planned for v2).
permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # -----------------------------------------------------------------------
      # fetch-depth: 0 is mandatory — both scanners walk git history. Shallow
      # clones miss credentials that were deleted from HEAD but remain in old
      # commits, which is the most common real-world leak pattern.
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout workflow helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-armor
          sparse-checkout: |
            scripts
            .github/actions

      # -----------------------------------------------------------------------
      # 1. Gitleaks. Pinned to a major version via the official action; we
      #    pass --no-banner for clean logs and route findings to a JSON file
      #    rather than relying on the action's exit code.
      # -----------------------------------------------------------------------
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          # SHA256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, taken from the
          # signed checksums.txt in the upstream GitHub release. Bump
          # alongside GITLEAKS_VERSION.
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Resolve the commit range once so both scanners scan the same thing.
      - name: Resolve scan range
        env:
          DEPTH: ${{ inputs.scan_depth }}
          BASE_REF: ${{ inputs.base_ref || github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          since=""
          if [ "$DEPTH" = "diff" ] || [ "$DEPTH" = "staged" ]; then
            if [ -n "$BASE_REF" ] && git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
              since="$(git merge-base "origin/$BASE_REF" HEAD)"
            elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              since="$BEFORE_SHA"
            else
              echo "::notice::No base for a diff scan; scanning full history."
            fi
          fi
          echo "SCAN_SINCE=$since" >> "$GITHUB_ENV"

      - name: Run Gitleaks
        env:
          BASELINE: ${{ inputs.baseline_file }}
        run: |
          set +e
          args=(git . --no-banner --redact --report-format json --report-path gitleaks-report.json)
          if [ -f "$BASELINE" ]; then
            args+=(--baseline-path "$BASELINE")
          fi
          if [ -n "$SCAN_SINCE" ]; then
            args+=("--log-opts=$SCAN_SINCE..HEAD")
          fi
          gitleaks "${args[@]}"
          echo "GITLEAKS_EXIT=$?" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 2. Trufflehog. We use `--only-verified` so we only report secrets
      #    where the credential was confirmed live by the upstream provider.
      #    This is the difference between "we found something that looks like
      #    an AWS key" and "we found a working AWS key" — the latter being
      #    the only kind we want to page a human about.
      # -----------------------------------------------------------------------
      - name: Install Trufflehog
        env:
          TRUFFLEHOG_VERSION: '3.96.0'
          # SHA256 of trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz from the upstream
          # release checksums. Bump alongside TRUFFLEHOG_VERSION.
          TRUFFLEHOG_SHA256: '7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0'
        run: |
          set -euo pipefail
          curl -sSLo /tmp/th.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  /tmp/th.tar.gz" | sha256sum -c -
          tar -xzf /tmp/th.tar.gz -C /tmp trufflehog
          sudo mv /tmp/trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Run Trufflehog
        env:
          EXCLUDE_DETECTORS: ${{ inputs.trufflehog_exclude_detectors }}
        run: |
          set +e
          args=(git "file://$GITHUB_WORKSPACE" --json --only-verified --no-update)
          if [ -n "$EXCLUDE_DETECTORS" ]; then
            args+=("--exclude-detectors=$EXCLUDE_DETECTORS")
          fi
          if [ -n "$SCAN_SINCE" ]; then
            args+=(--since-commit "$SCAN_SINCE" --branch HEAD)
          fi
          trufflehog "${args[@]}" > trufflehog-report.json
          echo "TRUFFLEHOG_EXIT=$?" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 3. Combine, deduplicate, and render reports. Per policy, we NEVER
      #    print the secret value — only the rule that fired, file:line, and
      #    a one-line redacted preview.
      # -----------------------------------------------------------------------
      - name: Combine findings
        id: combine
        env:
          BASELINE_FILE: ${{ inputs.baseline_file }}
        run: |
          python3 "$GITHUB_WORKSPACE/.pipeline-armor/scripts/combine-secret-findings.py" \
            --gitleaks-report gitleaks-report.json \
            --trufflehog-report trufflehog-report.json \
            --baseline-file "$BASELINE_FILE" \
            --summary-json-out secrets-summary.json \
            --summary-md-out secrets-summary.md \
            --outputs-out "$GITHUB_OUTPUT" \
            --sarif-out secrets.sarif \
            --gitleaks-exit "${GITLEAKS_EXIT:-}" \
            --trufflehog-exit "${TRUFFLEHOG_EXIT:-}"
          cat secrets-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && hashFiles('secrets-summary.md') != ''
        uses: ./.pipeline-armor/.github/actions/upsert-pr-comment
        with:
          marker: '<!-- pipeline-armor:secrets -->'
          body-file: secrets-summary.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: secret-scan-reports
          path: |
            gitleaks-report.json
            trufflehog-report.json
            secrets-summary.json
            secrets-summary.md
            secrets.sarif
          if-no-files-found: ignore
          retention-days: 30

      # -----------------------------------------------------------------------
      # 4. Gate. Only verified secrets fail the build by default — unverified
      #    findings are surfaced for review but treated as informational, on
      #    the theory that a hard fail on regex hits creates alert fatigue
      #    and trains engineers to skip the gate with `--no-verify`.
      # -----------------------------------------------------------------------
      - name: Enforce gate
        if: inputs.fail_on_detection
        env:
          VERIFIED: ${{ steps.combine.outputs.verified }}
          UNVERIFIED: ${{ steps.combine.outputs.unverified }}
          TOOL_ERRORS: ${{ steps.combine.outputs.tool_errors }}
          FAIL_ON_UNVERIFIED: ${{ inputs.fail_on_unverified }}
        run: |
          if [ "${TOOL_ERRORS:-0}" -gt 0 ]; then
            echo "::error::Secret scan gate failed: $TOOL_ERRORS scanner(s) did not complete. See the job summary."
            exit 1
          fi
          if [ "${VERIFIED:-0}" -gt 0 ]; then
            echo "::error::Secret scan gate failed: $VERIFIED verified secret(s) detected."
            echo "See the job summary for remediation steps."
            exit 1
          fi
          if [ "$FAIL_ON_UNVERIFIED" = "true" ] && [ "${UNVERIFIED:-0}" -gt 0 ]; then
            echo "::error::Secret scan gate failed: $UNVERIFIED unverified finding(s) and fail_on_unverified is enabled."
            echo "Triage each finding; add accepted false positives to the baseline file."
            exit 1
          fi
          echo "Secret scan gate passed."
