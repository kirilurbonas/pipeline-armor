# =============================================================================
# pipeline-armor :: reusable-iac-scan.yml
# -----------------------------------------------------------------------------
# Infrastructure-as-Code security scanning with Checkov.
#
# Checkov is broad but noisy out of the box — the `checkov_skip_checks` input
# is the recommended way to suppress known-irrelevant rules in a per-repo
# manner. Use the `policies/severity-thresholds.yml` file for organization-
# wide defaults.
#
# Why Checkov and not tfsec/kics?
#   - Single tool covers Terraform, CloudFormation, Kubernetes, Dockerfile.
#   - Built-in CIS / SOC2 / PCI-DSS mappings, useful for compliance reporting.
#   - SARIF output is well-formed and uploads cleanly to the Security tab.
# =============================================================================
name: reusable-iac-scan

on:
  workflow_call:
    inputs:
      iac_directory:
        description: 'Directory containing IaC files to scan.'
        type: string
        default: '.'
      framework:
        description: 'IaC framework: terraform|cloudformation|kubernetes|dockerfile|all'
        type: string
        default: 'terraform'
      fail_on_severity:
        description: 'Lowest severity that fails the build: low|medium|high|critical'
        type: string
        default: 'high'
      soft_fail:
        description: 'If true, never fail the pipeline regardless of findings.'
        type: boolean
        default: false
      checkov_skip_checks:
        description: 'Comma-separated Checkov check IDs to skip, e.g. CKV_AWS_18,CKV_AWS_52'
        type: string
        default: ''
      checkov_external_checks:
        description: 'Path to a directory of custom Checkov policies, optional.'
        type: string
        default: ''
      iac_default_severity:
        description: >-
          Severity for Checkov checks with no rating (Checkov OSS rates none;
          pipeline-armor rates common checks in policies/checkov-severity.json).
          low|medium|high|critical. Default high, so unrated findings fail closed.
        type: string
        default: 'high'
      sarif_upload:
        description: 'Upload SARIF results to the GitHub Security tab.'
        type: boolean
        default: true
      checkov_severity_map:
        description: >-
          Optional path (in your repo) to a JSON file shaped like
          policies/checkov-severity.json; its entries override the built-in map.
        type: string
        default: ''

concurrency:
  # Include iac_directory + framework so callers can scan multiple stacks in
  # one pipeline without cross-cancellation.
  group: iac-scan-${{ github.workflow }}-${{ github.ref }}-${{ inputs.iac_directory }}-${{ inputs.framework }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  iac:
    name: IaC scan (${{ inputs.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout workflow helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-armor
          sparse-checkout: |
            scripts
            policies
            .github/actions

      # No `cache: pip` here: setup-python's pip cache errors out in caller
      # repos with no requirements.txt/pyproject.toml (e.g. pure Terraform).
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: |
          pip install --quiet 'checkov==3.3.8'
          checkov --version

      # -----------------------------------------------------------------------
      # 1. One Checkov run, two outputs (JSON for our parser, SARIF for the
      #    Security tab), so both always see the same checks — including
      #    external ones. --soft-fail keeps the exit code 0 on findings; any
      #    other exit code is a scanner failure and fails the gate closed.
      # -----------------------------------------------------------------------
      - name: Run Checkov
        env:
          SKIP: ${{ inputs.checkov_skip_checks }}
          EXTERNAL: ${{ inputs.checkov_external_checks }}
          IAC_DIR: ${{ inputs.iac_directory }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set +e
          checkov \
            --directory "$IAC_DIR" \
            --framework "$FRAMEWORK" \
            --output json \
            --output sarif \
            --output-file-path checkov-out \
            --soft-fail \
            --quiet \
            ${SKIP:+--skip-check "$SKIP"} \
            ${EXTERNAL:+--external-checks-dir "$EXTERNAL"}
          echo "CHECKOV_EXIT_CODE=$?" >> "$GITHUB_ENV"
          [ -f checkov-out/results_json.json ] && mv checkov-out/results_json.json checkov-results.json
          [ -f checkov-out/results_sarif.sarif ] && mv checkov-out/results_sarif.sarif checkov.sarif
          rm -rf checkov-out
          exit 0

      # -----------------------------------------------------------------------
      # 2. Parse + summarize. The parser script maps Checkov check IDs to
      #    compliance frameworks and computes a breach count for the gate.
      #    It also patches the SARIF file to include security severities.
      # -----------------------------------------------------------------------
      - name: Parse Checkov report
        id: parse
        env:
          FAIL_ON: ${{ inputs.fail_on_severity }}
          DEFAULT_SEVERITY: ${{ inputs.iac_default_severity }}
          SEVERITY_MAP: ${{ inputs.checkov_severity_map }}
        run: |
          python3 .pipeline-armor/scripts/parse-checkov-report.py \
            --report checkov-results.json \
            --fail-on "$FAIL_ON" \
            --default-severity "$DEFAULT_SEVERITY" \
            --checkov-exit "${CHECKOV_EXIT_CODE:-}" \
            ${SEVERITY_MAP:+--severity-map "$SEVERITY_MAP"} \
            --summary-out checkov-summary.md \
            --comment-out checkov-comment.md \
            --counts-out checkov-counts.json \
            --sarif-in checkov.sarif
          cat checkov-summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os
          c = json.load(open("checkov-counts.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in c.items():
                  f.write(f"{k}={v}\n")
          PY

      - name: Upload Checkov SARIF
        if: inputs.sarif_upload && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Comment on PR
        if: github.event_name == 'pull_request' && hashFiles('checkov-comment.md') != ''
        uses: ./.pipeline-armor/.github/actions/upsert-pr-comment
        with:
          marker: '<!-- pipeline-armor:iac -->'
          body-file: checkov-comment.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iac-scan-reports
          path: |
            checkov-results.json
            checkov.sarif
            checkov-summary.md
            checkov-comment.md
            checkov-counts.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce severity gate
        if: inputs.soft_fail == false
        env:
          BREACHES: ${{ steps.parse.outputs.breaches }}
          FAIL_ON: ${{ inputs.fail_on_severity }}
        run: |
          if [ "${BREACHES:-0}" -gt 0 ]; then
            echo "::error::IaC scan gate failed: $BREACHES finding(s) at or above '$FAIL_ON' or scanner error(s)."
            exit 1
          fi
          echo "IaC scan gate passed."
