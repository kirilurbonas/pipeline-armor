# =============================================================================
# pipeline-armor :: ci-self-test.yml
# -----------------------------------------------------------------------------
# Smoke tests for the reusable workflows in this repository.
#
# This file gives us a "dogfooding" pipeline: every PR to pipeline-armor runs
# the reusable workflows against the bundled example apps. If a template ever
# regresses, this catches it before any consumer ever upgrades.
#
# It also serves as the canonical reference for how to wire up each workflow.
# =============================================================================
name: ci-self-test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-flight runs on the same branch — the self-test is purely a smoke
# test and the latest commit's run is the one we care about.
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; each job that calls a reusable workflow grants
# exactly what that workflow declares (a called workflow cannot exceed the
# caller job's grants).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint the workflow YAML and the policy files. Catches accidental indentation
  # / schema errors before we exercise any of the reusable jobs.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint workflows + policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install --quiet 'yamllint==1.35.1'
      - name: yamllint
        run: yamllint .github/workflows/ policies/
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
        with:
          files: ".github/workflows/*.yml"
      - name: Workflow SAST (semgrep p/github-actions)
        run: |
          # Same semgrep pin as reusable-sast.yml (the Snyk-style consistency
          # check below guards the Snyk pins; this one is asserted by grep).
          pin=$(grep -oE 'semgrep==[0-9.]+' .github/workflows/reusable-sast.yml | head -1)
          pip install --quiet "$pin"
          semgrep scan --config p/github-actions --error --metrics=off .github/workflows/
      - name: Workflow SAST (zizmor)
        run: |
          pip install --quiet 'zizmor==1.29.0'
          zizmor --no-progress --offline .github/workflows/ .github/actions/
      - name: Snyk pin consistency
        run: |
          # SNYK_VERSION/SNYK_SHA256 are pinned in two workflows and must be
          # bumped in lockstep; fail the build if they ever drift apart.
          a=$(grep -h "SNYK_VERSION:\|SNYK_SHA256:" .github/workflows/reusable-sast.yml)
          b=$(grep -h "SNYK_VERSION:\|SNYK_SHA256:" .github/workflows/reusable-dependency-review.yml)
          if [ "$a" != "$b" ]; then
            echo "::error::Snyk pin drift between reusable-sast.yml and reusable-dependency-review.yml"
            diff <(echo "$a") <(echo "$b") || true
            exit 1
          fi
          echo "Snyk pins are consistent."

  # ---------------------------------------------------------------------------
  # Self-test the Python parser scripts directly. They have to handle
  # malformed / empty input from upstream scanners; small unit-style checks
  # here keep us honest.
  # ---------------------------------------------------------------------------
  scripts:
    name: Test helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install --quiet 'pytest==8.3.4' 'pytest-cov==6.0.0' 'ruff==0.12.0'
      - name: Ruff
        run: python3 -m ruff check scripts tests
      - name: Run unit tests (with coverage floor)
        run: python3 -m pytest tests/ -q --cov=scripts --cov-report=term --cov-fail-under=80
      - name: Run script smoke tests
        run: |
          # Each script should accept --help cleanly.
          python3 scripts/parse-trivy-report.py --help
          python3 scripts/parse-checkov-report.py --help
          python3 scripts/generate-sbom-summary.py --help
          python3 scripts/parse-dependency-report.py --help
          python3 scripts/evaluate-deploy-gate.py --help
          python3 scripts/summarize-sast-findings.py --help
          python3 scripts/evaluate-licenses.py --help
          python3 scripts/combine-secret-findings.py --help
          python3 scripts/parse-osv-report.py --help

          python3 scripts/parse-osv-report.py \
            --report empty.json --fail-on high \
            --summary-out /tmp/s4.md --comment-out /tmp/c4.md --counts-out /tmp/k4.json
          test -s /tmp/k4.json

          # Empty-input behavior: scripts should produce a valid empty report
          # rather than crashing.
          echo '{}' > empty.json
          python3 scripts/parse-trivy-report.py \
            --report empty.json --config-report empty.json --sbom-summary empty.json \
            --image test:latest --build-duration 0 --image-size-mb 0 \
            --fail-on HIGH \
            --summary-out /tmp/s.md --comment-out /tmp/c.md --counts-out /tmp/k.json
          python3 scripts/parse-checkov-report.py \
            --report empty.json --fail-on high \
            --summary-out /tmp/s2.md --comment-out /tmp/c2.md --counts-out /tmp/k2.json
          python3 scripts/generate-sbom-summary.py empty.json > /tmp/sbom.json
          python3 scripts/parse-dependency-report.py \
            --snyk-report empty.json --fail-on high \
            --summary-out /tmp/s3.md --comment-out /tmp/c3.md --counts-out /tmp/k3.json
          mkdir -p /tmp/gate-fixture/container-scan-reports
          cp /tmp/k.json /tmp/gate-fixture/container-scan-reports/trivy-counts.json
          python3 scripts/evaluate-deploy-gate.py \
            --artifacts-dir /tmp/gate-fixture --environment dev \
            --required-scans container \
            --run-id self-test \
            --summary-out /tmp/gate-summary.md --report-out /tmp/gate-report.json
          test -s /tmp/k.json && test -s /tmp/k2.json && test -s /tmp/k3.json
          echo "Helper-script smoke tests passed."

  # ---------------------------------------------------------------------------
  # Prove the gate actually gates. The example jobs run against clean code and
  # never produce findings, so this job feeds the deploy-gate evaluator known
  # bad (and known clean) fixtures and asserts on the decision both ways.
  # ---------------------------------------------------------------------------
  gate-enforcement:
    name: Gate enforcement (positive + negative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Blocking fixtures must fail the gate
        run: |
          set -euo pipefail
          if python3 scripts/evaluate-deploy-gate.py \
            --artifacts-dir tests/fixtures/gate-blocking \
            --environment prod \
            --required-scans sast,container,iac,secrets,dependencies \
            --run-id gate-negative-test \
            --summary-out /tmp/block-summary.md \
            --report-out /tmp/block-report.json; then
            : # the script itself exits 0; the decision field is what gates
          fi
          python3 -c "import json; r = json.load(open('/tmp/block-report.json')); assert r['decision'] == 'fail', r; assert r['breaches'] > 0, r"
          echo "Blocking fixtures correctly produced decision=fail."
      - name: Clean fixtures must pass the gate
        run: |
          set -euo pipefail
          python3 scripts/evaluate-deploy-gate.py \
            --artifacts-dir tests/fixtures/gate-passing \
            --environment prod \
            --required-scans sast,container,iac,secrets,dependencies \
            --run-id gate-positive-test \
            --summary-out /tmp/pass-summary.md \
            --report-out /tmp/pass-report.json
          python3 -c "import json; r = json.load(open('/tmp/pass-report.json')); assert r['decision'] == 'pass', r; assert r['score'] == 100, r"
          echo "Clean fixtures correctly produced decision=pass."

  # ---------------------------------------------------------------------------
  # Exercise the reusable workflows against the bundled examples. These run
  # in parallel — each is a self-contained call site.
  # ---------------------------------------------------------------------------
  example-secret-scan:
    name: Example | secret-scan
    uses: ./.github/workflows/reusable-secret-scan.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      scan_depth: all
      # Self-test runs on a clean repo: a real verified secret should never
      # be found, so failing on detection is the correct behavior here.
      fail_on_detection: true

  example-iac-scan:
    name: Example | iac-scan (terraform)
    uses: ./.github/workflows/reusable-iac-scan.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      iac_directory: examples/terraform-infra
      framework: terraform
      # Soft fail in self-test: the example HCL is intentionally simple and
      # may surface low-priority Checkov findings. A real consumer should
      # leave soft_fail off and tighten with checkov_skip_checks.
      soft_fail: true

  example-iac-scan-dockerfile:
    name: Example | iac-scan (dockerfile)
    uses: ./.github/workflows/reusable-iac-scan.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      iac_directory: examples/nodejs-app
      framework: dockerfile
      soft_fail: true

  example-iac-scan-k8s:
    name: Example | iac-scan (kubernetes)
    uses: ./.github/workflows/reusable-iac-scan.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      iac_directory: examples/k8s-manifests
      framework: kubernetes
      soft_fail: true

  example-sast-node:
    name: Example | sast (Node.js)
    uses: ./.github/workflows/reusable-sast.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      language: javascript
      working_directory: examples/nodejs-app
      # Self-test runs without a Snyk token, so we explicitly disable that
      # scanner and rely on Semgrep only.
      snyk_enable: false
      fail_on_severity: critical

  example-sast-python:
    name: Example | sast (Python)
    uses: ./.github/workflows/reusable-sast.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      language: python
      working_directory: examples/python-app
      snyk_enable: false
      fail_on_severity: critical

  example-dependency-review-node:
    name: Example | dependency-review (Node.js)
    uses: ./.github/workflows/reusable-dependency-review.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      ecosystem: npm
      working_directory: examples/nodejs-app
      snyk_enable: false
      fail_on_severity: critical

  example-container-scan-node:
    name: Example | container-scan (Node.js)
    uses: ./.github/workflows/reusable-container-scan.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      image_ref: pipeline-armor-node:${{ github.sha }}
      build_context: examples/nodejs-app
      fail_on_severity: critical
      enable_sbom: true

  example-dependency-review-pip:
    name: Example | dependency-review (Python)
    uses: ./.github/workflows/reusable-dependency-review.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      ecosystem: pip
      working_directory: examples/python-app
      snyk_enable: false
      fail_on_severity: critical

  example-osv-scan:
    name: Example | osv-scan (Node.js)
    uses: ./.github/workflows/reusable-osv-scan.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      working_directory: examples/nodejs-app
      # The example lockfile legitimately accumulates real CVEs between
      # Dependabot bumps; gate the self-test on critical only.
      fail_on_severity: critical

  # ---------------------------------------------------------------------------
  # End-to-end deploy gate: consumes the artifacts the example jobs above
  # uploaded, exercising the artifact-download path, the .pipeline-armor
  # sparse checkout, the policy file, and the decision wiring — the full
  # consumer experience, not just the evaluator script.
  # ---------------------------------------------------------------------------
  example-deploy-gate:
    name: Example | deploy-gate (dev)
    needs:
      - example-secret-scan
      - example-iac-scan
      - example-iac-scan-dockerfile
      - example-iac-scan-k8s
      - example-sast-node
      - example-sast-python
      - example-dependency-review-node
      - example-dependency-review-pip
      - example-container-scan-node
      - example-osv-scan
    if: always()
    uses: ./.github/workflows/reusable-deploy-gate.yml
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: write
      issues: write
    with:
      environment: dev
      required_scans: 'sast,container,iac,secrets,dependencies,osv'
