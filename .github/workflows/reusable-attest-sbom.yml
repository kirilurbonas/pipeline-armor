# =============================================================================
# pipeline-armor :: reusable-attest-sbom.yml
# -----------------------------------------------------------------------------
# Signed attestation over the SBOM produced by reusable-container-scan.yml.
#
# This is a separate workflow (not an input on container-scan) on purpose:
# GitHub validates a called workflow's job permissions against the caller's
# grants at startup — even for jobs that would be skipped — so an optional
# attest job inside container-scan would force EVERY caller to grant
# `id-token: write` + `attestations: write`. Keeping it standalone makes the
# elevated permissions strictly opt-in: only callers of this workflow grant
# them.
#
# This attests the SBOM *file* (verifiable with `gh attestation verify`);
# image provenance/signing belongs in the workflow that pushes the image to
# a registry — see docs/security-gates.md.
#
# Usage: run with `needs:` on your container-scan job:
#
#   attest-sbom:
#     needs: [container-scan]
#     permissions: { contents: read, id-token: write, attestations: write, actions: read }
#     uses: kirilurbonas/pipeline-armor/.github/workflows/reusable-attest-sbom.yml@v1
# =============================================================================
name: reusable-attest-sbom

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the uploaded artifact containing the SBOM.'
        type: string
        default: 'container-scan-reports'
      sbom_file:
        description: 'SBOM filename within the artifact.'
        type: string
        default: 'sbom.json'

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  attest:
    name: Attest SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: reports

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: reports/${{ inputs.sbom_file }}
          sbom-path: reports/${{ inputs.sbom_file }}
