# =============================================================================
# pipeline-armor :: reusable-container-scan.yml
# -----------------------------------------------------------------------------
# Container image security scanning.
#
# What this does:
#   1. Builds the Docker image from the caller's Dockerfile.
#   2. Runs Trivy in three modes:
#        - Image scan: vulnerabilities in OS packages and language libs.
#        - Config scan: misconfigurations in the Dockerfile itself.
#        - SBOM:      CycloneDX software bill of materials.
#   3. Uploads SARIF to the Security tab, attaches a PR comment with a
#      vulnerability + SBOM summary, and gates the pipeline by severity.
#
# We always run scans with `--exit-code 0` first to produce the report, and
# only enforce a non-zero exit in a final, isolated gate step. That way the
# caller always gets a full report — even when the build fails the gate.
# =============================================================================
name: reusable-container-scan

on:
  workflow_call:
    inputs:
      image_ref:
        description: 'Image reference to build and scan, e.g. myapp:<git-sha>'
        type: string
        required: true
      dockerfile_path:
        description: 'Path to the Dockerfile, relative to build_context.'
        type: string
        default: 'Dockerfile'
      build_context:
        description: 'Docker build context directory.'
        type: string
        default: '.'
      fail_on_severity:
        description: 'Lowest severity that fails the build: LOW|MEDIUM|HIGH|CRITICAL.'
        type: string
        default: 'HIGH'
      skip_files:
        description: 'Comma-separated paths within the image to skip during scanning.'
        type: string
        default: ''
      enable_sbom:
        description: 'Emit a CycloneDX SBOM as an artifact.'
        type: boolean
        default: true
      ignore_unfixed:
        description: 'Ignore vulnerabilities for which no upstream fix exists.'
        type: boolean
        default: true
concurrency:
  group: container-scan-${{ github.workflow }}-${{ github.ref }}-${{ inputs.image_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    name: Container scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Checkout workflow helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-armor
          sparse-checkout: |
            scripts

      # -----------------------------------------------------------------------
      # 1. Build the image. We use docker buildx with --load so the image lands
      #    in the local daemon and Trivy can scan it without pushing to a
      #    registry. We capture build time and final image size for the
      #    summary table.
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image
        id: build
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        run: |
          start=$(date +%s)
          docker buildx build \
            --load \
            -t "$IMAGE_REF" \
            -f "$BUILD_CONTEXT/$DOCKERFILE_PATH" \
            "$BUILD_CONTEXT"
          end=$(date +%s)
          duration=$(( end - start ))
          size_bytes=$(docker image inspect "$IMAGE_REF" --format '{{.Size}}')
          # Convert to MB with one decimal place via awk to avoid bashisms.
          size_mb=$(awk -v b="$size_bytes" 'BEGIN { printf "%.1f", b/1024/1024 }')
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "size_mb=$size_mb"   >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 2. Install Trivy. Download the release tarball directly and verify it
      #    against a pinned SHA256 — the same pattern as Gitleaks/Trufflehog/
      #    Snyk in the sibling workflows. TRIVY_SHA256 is the entry for
      #    trivy_<ver>_Linux-64bit.tar.gz in the upstream release checksums
      #    file; bump both together.
      # -----------------------------------------------------------------------
      - name: Install Trivy
        env:
          TRIVY_VERSION: '0.72.0'
          TRIVY_SHA256: 'bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea'
        run: |
          set -euo pipefail
          curl -sSLo /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # -----------------------------------------------------------------------
      # 3. Vulnerability scan (JSON + SARIF). Two passes: full report for the
      #    PR comment, and a SARIF output for the Security tab. The third
      #    pass — the gate — only happens at the end.
      # -----------------------------------------------------------------------
      - name: Trivy image scan (JSON, full)
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          SKIP_FILES: ${{ inputs.skip_files }}
          IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
        run: |
          extra_args=()
          if [ "$IGNORE_UNFIXED" = "true" ]; then extra_args+=(--ignore-unfixed); fi
          if [ -n "$SKIP_FILES" ]; then extra_args+=(--skip-files "$SKIP_FILES"); fi
          trivy image \
            --exit-code 0 \
            --format json \
            --output trivy-full.json \
            --scanners vuln,secret,misconfig \
            "${extra_args[@]}" \
            "$IMAGE_REF"

      - name: Trivy image scan (SARIF)
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          trivy image \
            --exit-code 0 \
            --format sarif \
            --output trivy.sarif \
            "$IMAGE_REF"

      - name: Upload Trivy SARIF
        if: hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # -----------------------------------------------------------------------
      # 4. Dockerfile misconfig scan. This catches things like `USER root`,
      #    missing HEALTHCHECK, world-writable directories, etc.
      # -----------------------------------------------------------------------
      - name: Trivy Dockerfile config scan
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        run: |
          trivy config \
            --exit-code 0 \
            --format json \
            --output trivy-config.json \
            "$BUILD_CONTEXT/$DOCKERFILE_PATH"

      # -----------------------------------------------------------------------
      # 5. SBOM. We emit CycloneDX format because it's the most broadly
      #    supported by downstream consumers (Dependency-Track, GitHub
      #    Dependency Graph, etc.).
      # -----------------------------------------------------------------------
      - name: Generate CycloneDX SBOM
        if: inputs.enable_sbom
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom.json \
            "$IMAGE_REF"

      - name: Summarize SBOM
        if: inputs.enable_sbom
        run: python3 .pipeline-armor/scripts/generate-sbom-summary.py sbom.json > sbom-summary.json

      # -----------------------------------------------------------------------
      # 6. Parse Trivy results and render a job summary. We do this inline so
      #    the workflow stays self-contained and doesn't require a Python
      #    script for the most common case.
      # -----------------------------------------------------------------------
      - name: Summarize findings
        id: summary
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          BUILD_DURATION: ${{ steps.build.outputs.duration }}
          IMAGE_SIZE: ${{ steps.build.outputs.size_mb }}
          FAIL_ON: ${{ inputs.fail_on_severity }}
        run: |
          python3 .pipeline-armor/scripts/parse-trivy-report.py \
            --report trivy-full.json \
            --config-report trivy-config.json \
            --sbom-summary sbom-summary.json \
            --image "$IMAGE_REF" \
            --build-duration "$BUILD_DURATION" \
            --image-size-mb "$IMAGE_SIZE" \
            --fail-on "$FAIL_ON" \
            --summary-out trivy-summary.md \
            --comment-out trivy-comment.md \
            --counts-out trivy-counts.json
          cat trivy-summary.md >> "$GITHUB_STEP_SUMMARY"
          # Surface the highest-priority counts for the gate step below.
          python3 - <<'PY'
          import json, os
          c = json.load(open("trivy-counts.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in c.items():
                  f.write(f"{k}={v}\n")
          PY

      - name: Comment on PR
        if: github.event_name == 'pull_request' && hashFiles('trivy-comment.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('trivy-comment.md', 'utf8');
            const marker = '<!-- pipeline-armor:container -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: marker + '\n' + body,
              });
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: container-scan-reports
          path: |
            trivy-full.json
            trivy.sarif
            trivy-config.json
            sbom.json
            sbom-summary.json
            trivy-summary.md
            trivy-comment.md
            trivy-counts.json
          if-no-files-found: ignore
          retention-days: 30

      # -----------------------------------------------------------------------
      # 7. Severity gate. Runs last so the report is always uploaded. We
      #    consult the per-severity counts produced above.
      # -----------------------------------------------------------------------
      - name: Enforce severity gate
        env:
          FAIL_ON: ${{ inputs.fail_on_severity }}
          BREACHES: ${{ steps.summary.outputs.breaches }}
        run: |
          if [ "${BREACHES:-0}" -gt 0 ]; then
            echo "::error::Container scan gate failed: $BREACHES finding(s) at or above '$FAIL_ON'."
            exit 1
          fi
          echo "Container scan gate passed."
